[project]
name = "youtube-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "google-genai>=2.3.0",
    "langchain-core>=1.3.1",
    "langchain-text-splitters>=1.1.0",
    "langsmith>=0.4.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.14.0",
    "redis>=5.0.0",
    "sentence-transformers>=5.0.0",
    "torch==2.8.0+cpu",
    "tqdm>=4.0.0",
    "uvicorn>=0.47.0",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.3.17",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
